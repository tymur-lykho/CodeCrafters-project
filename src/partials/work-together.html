<footer class="work-together" id="work-together">
  <div class="footer-container container">
    <h2 class="footer-title">
      Let’s <span class="accent-word">work</span> together
    </h2>
    <form method="post" class="footer-form" id="js-footer-form">
      <div class="input-wrap">
        <label class="form-label email-label" for="input-email">
          <span class="visually-hidden">Input your e-mail</span>
          <input
            class="form-input"
            type="email"
            name="input-email"
            id="input-email"
            placeholder="clients@gmail.com"
            pattern="^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$"
            required
          />
        </label>
        <label class="form-label" for="input-comment">
          <span class="visually-hidden">Input your comment</span>
          <input
            type="text"
            class="form-input"
            name="input-comment"
            id="input-comment"
            placeholder="comments"
            required
          />
        </label>
      </div>
      <button type="submit" class="form-btn">Send</button>
    </form>
    <ul class="footer-contact-list">
      <li>
        <a class="contact-link" href="mailto:lloydjefferson@gmail.com">
          lloydjefferson@gmail.com
        </a>
      </li>
      <li>
        <a class="contact-link" href="tel:+380 11 1111 11 11"
          >+380 11 1111 11 11</a
        >
      </li>
    </ul>
  </div>
</footer>
