<section class="reviews section" id="reviews-section">
  <div class="container reviews-container">
    <h2 class="title">reviews</h2>
    <div class="swiper swiper-reviews">
      <ul class="swiper-wrapper reviews-list"></ul>
      <div class="reviews-btn-container">
        <button
          type="button"
          class="arrow-btn reviews-btn-prev"
          aria-label="Swipe button previous review"
        >
          <svg class="projects-icon" width="24" height="24">
            <use href="./img/sprite.svg#arrow-narrow"></use>
          </svg>
        </button>
        <button
          type="button"
          class="arrow-btn reviews-btn-next"
          aria-label="Swipe button next review"
        >
          <svg class="icon-arrow-right" width="24" height="24">
            <use href="./img/sprite.svg#arrow-narrow"></use>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
